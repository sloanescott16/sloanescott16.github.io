<style>
:root{--bg:#0b1220;--card:#131c2e;--line:#22304a;--ink:#e8eef8;--dim:#8a98b3}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100dvh;padding:calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
h1{font-family:Oswald,sans-serif;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  font-size:clamp(28px,5vw,44px);margin-bottom:14px}
.live{display:inline-flex;align-items:center;gap:10px;margin-bottom:22px;padding:8px 20px;border-radius:999px;border:1px solid var(--line);background:var(--card);
  color:var(--ink);text-decoration:none;font-family:Oswald,sans-serif;font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:15px;font-variant-numeric:tabular-nums;
  transition:transform .15s,border-color .15s,box-shadow .15s}
.live i{width:9px;height:9px;border-radius:50%;background:var(--dim)}
.live.on{border-color:#ef4444}.live.on i{background:#ef4444;animation:lp 1.6s infinite}
.live:hover,.live:focus-visible{transform:translateY(-2px);border-color:#ef4444;box-shadow:0 8px 24px rgba(239,68,68,.25);outline:none}
.live.pl{margin-left:8px}.live.pl:hover,.live.pl:focus-visible{border-color:#3b82f6;box-shadow:0 8px 24px rgba(59,130,246,.25)}   /* v33 */
@keyframes lp{0%{box-shadow:0 0 0 0 rgba(239,68,68,.6)}70%{box-shadow:0 0 0 8px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
@media (prefers-reduced-motion:reduce){.live.on i{animation:none}}
.sub{color:var(--dim);font-size:14px;margin-bottom:28px;letter-spacing:.04em}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;width:100%;max-width:min(760px,calc(100dvh - 200px))}
.tile{--c:#3b82f6;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  aspect-ratio:1/1;border-radius:20px;background:var(--card);border:1px solid var(--line);
  border-top:5px solid var(--c);color:var(--ink);text-decoration:none;overflow:hidden;
  transition:transform .15s,border-color .15s,box-shadow .15s}
.tile::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--c) 22%,transparent),transparent 65%);pointer-events:none}
a.tile:hover,a.tile:focus-visible{transform:translateY(-3px);border-color:var(--c);box-shadow:0 10px 30px color-mix(in srgb,var(--c) 30%,transparent);outline:none}
a.tile:active{transform:scale(.98)}
.tile img{position:relative;width:56%;max-width:190px;aspect-ratio:1/1;object-fit:contain;filter:drop-shadow(0 0 1px rgba(255,255,255,.55))}
.pair{position:relative;display:flex;justify-content:center;align-items:center;gap:6%;width:88%}
.pair img{width:42%}.pair img:first-child{width:50%}
.sport{position:relative;font-family:Oswald,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:clamp(16px,3vw,24px)}
.name{position:relative;text-align:center;font-family:Oswald,sans-serif;font-weight:600;text-transform:uppercase;color:var(--ink);font-size:clamp(13px,2.3vw,18px);letter-spacing:.1em}
.tile.soon{cursor:default;opacity:.5}
.tile.soon img{filter:grayscale(1) drop-shadow(0 0 1px rgba(255,255,255,.4))}
.soon .pill{position:absolute;top:12px;right:12px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:3px 9px}
.tile .lv{position:absolute;top:12px;right:12px;display:none;align-items:center;gap:6px;
  font-family:Oswald,sans-serif;font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:11px;color:#fff;
  background:#ef4444;border-radius:999px;padding:3px 9px 3px 7px}
.tile .lv i{width:7px;height:7px;border-radius:50%;background:#fff;animation:lp 1.6s infinite}
.tile.on .lv{display:inline-flex}
.tile.on{border-color:#ef4444;box-shadow:0 0 0 1px rgba(239,68,68,.35)}
@media (max-width:420px){.tile .lv{top:8px;right:8px;font-size:10px;padding:2px 7px 2px 6px}}
@media (prefers-reduced-motion:reduce){.tile .lv i{animation:none}}
.tile.hk img{width:70%;max-width:260px;aspect-ratio:auto;transform:translateX(4%)}.tile.hk.soon img{filter:grayscale(1) brightness(1.6) drop-shadow(0 0 1px rgba(255,255,255,.5))}
/* v19: the football tile is two doors, Cowboys half opens Sunday, Double T half opens Saturday */
.split .hf{position:absolute;top:0;bottom:0;width:50%;z-index:2;border-radius:inherit}.split .hf.l{left:0}.split .hf.r{right:0}
.split .pair img{transition:transform .15s,opacity .15s}
.split:has(.hf:hover),.split:has(.hf:focus-visible){transform:translateY(-3px);border-color:var(--c);box-shadow:0 10px 30px color-mix(in srgb,var(--c) 30%,transparent)}
.split:has(.hf:active){transform:scale(.98)}
.split:has(.hf.r:hover),.split:has(.hf.r:focus-visible){--c:#cc0000}
.split:has(.hf.l:hover) .pair img:first-child,.split:has(.hf.l:focus-visible) .pair img:first-child,.split:has(.hf.r:hover) .pair img:last-child,.split:has(.hf.r:focus-visible) .pair img:last-child{transform:scale(1.07)}
.split:has(.hf.l:hover) .pair img:last-child,.split:has(.hf.l:focus-visible) .pair img:last-child,.split:has(.hf.r:hover) .pair img:first-child,.split:has(.hf.r:focus-visible) .pair img:first-child{opacity:.45}
.split .hf:focus-visible{outline:none}
.tile.on.onl .lv{right:auto;left:12px}
@media (max-width:420px){.tile.on.onl .lv{left:8px}}
.fb{--c:#3b82f6}.bb{--c:#c0111f}.hk{--c:#00843d}.bk{--c:#0064b1}
@media (max-width:420px){.grid{gap:12px}.tile{border-radius:16px;gap:8px}.soon .pill{top:8px;right:8px;font-size:10px}}

.tile.gf{--c:#f5d130}
.tile .cup{position:relative;left:auto;top:auto;transform:none;width:64%;max-width:220px;z-index:1;

/* v33 (league-look): calmer tiles. No coloured top bars or tinted glows; one neutral edge for every tile, and colour
   kept for state only (live red). Each tile carries a small neutral league chip in its bottom corner, so the Cowboys
   (NFL) and the Mavericks (NBA) no longer read as the same blue tile. The football tile has one chip per half (markup); the
   others draw theirs with ::after. Kept in its own style block so other lanes' edits to the one above merge cleanly. */
.tile,.tile.fb,.tile.bb,.tile.hk,.tile.bk,.tile.gf,.tile.sc{--c:#4a5b80;border-top:1px solid var(--line)}
.split:has(.hf.r:hover),.split:has(.hf.r:focus-visible){--c:#4a5b80}
.tile.tile.on{border-top-color:#ef4444}
.tile::before{background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.035),transparent 65%)}
a.tile:hover,a.tile:focus-visible,.split:has(.hf:hover),.split:has(.hf:focus-visible){box-shadow:0 10px 30px rgba(0,0,0,.45)}
a.tile.gf:hover .cup,a.tile.gf:focus-visible .cup{box-shadow:0 0 0 3px #4a5b80,0 14px 30px rgba(0,0,0,.6)}
.tile .lg,.tile.bb::after,.tile.hk::after,.tile.bk::after,.tile.gf::after,.tile.sc::after{position:absolute;box-sizing:border-box;left:12px;bottom:12px;z-index:1;pointer-events:none;min-width:38px;text-align:center;padding:2px 7px;border-radius:6px;
  border:1px solid #2c3a56;background:rgba(11,18,32,.82);color:#c9d3e4;font:500 12px/1.25 Oswald,sans-serif;letter-spacing:.1em;text-transform:uppercase}
.tile .lg.r{left:auto;right:12px}
.tile.bb::after{content:"MLB"}.tile.hk::after{content:"NHL"}.tile.bk::after{content:"NBA"}.tile.gf::after{content:"Golf"}.tile.sc::after{content:"Soccer"}
@media (max-width:420px){.tile .lg,.tile.bb::after,.tile.hk::after,.tile.bk::after,.tile.gf::after,.tile.sc::after{left:8px;bottom:8px;min-width:32px;padding:1px 5px;font-size:10.5px}.tile .lg.r{left:auto;right:8px}}
</style>

<script>

/* Hide a logo cleanly if its CDN is unreachable.

(function () {
  var SITE = "https://sloanescott16.github.io/";
  var LG = {
    nfl: { path: "football/nfl", q: "", fav: "DAL", game: SITE + "lone-star-board/?lg=nfl#game-" },
    cfb: { path: "football/college-football", q: "?groups=80&limit=400", fav: "TTU", game: SITE + "lone-star-board/?lg=cfb#game-" },
    mlb: { path: "baseball/mlb", q: "", fav: "TEX", game: SITE + "lone-star-diamond/#game-", pk: true },
    nhl: { path: "hockey/nhl", q: "", fav: "DAL", game: SITE + "the-crease/#game-" },
    nba: { path: "basketball/nba", q: "", fav: "DAL", game: SITE + "the-paint/#game-" }
  };
  var TILES = [
    { el: "tFbN", tile: "tFb", keys: ["nfl"], home: SITE + "lone-star-board/#home" },
    { el: "tFbC", tile: "tFb", keys: ["cfb"], home: SITE + "lone-star-board/#home" },
    { el: "tBb", keys: ["mlb"], home: SITE + "lone-star-diamond/" },
    { el: "tHk", keys: ["nhl"], home: SITE + "the-crease/#home" },
    { el: "tBk", keys: ["nba"], home: SITE + "the-paint/#home" }
  ];
  /* v31: soccer. The Pitch covers five sides across many competitions, so the count comes from the scoreboards it follows,
     plus any cup one of his five is about to play in (looked up from each side's next match every 15 minutes). */
  var SOC = { base: ["eng.1", "esp.1", "uefa.champions", "usa.1", "fifa.friendly", "fifa.world", "concacaf.nations.league", "uefa.nations"],
    mine: { "185": 1, "360": 1, "86": 1, "1068": 1, "660": 1 }, cups: [], at: 0, live: "", n: 0 };
  var ESPN = "https://site.api.espn.com/apis/site/v2/sports/soccer/";
  /* v32: every board is asked for today's Central date by name. ESPN's undated MLB, NHL and NBA boards keep
     showing yesterday until about midday, so a morning game went uncounted. Before 6 AM yesterday is asked for
     as well, so a late West Coast game still running after midnight still counts. */
  var CT = new Intl.DateTimeFormat("en-CA", { timeZone: "America/Chicago", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", hourCycle: "h23" });
  function ctKey(d, off) {
    var o = {}; CT.formatToParts(d).forEach(function (x) { o[x.type] = x.value; });
    var t = new Date(Date.UTC(+o.year, +o.month - 1, +o.day + (off || 0)));
    return { k: t.getUTCFullYear() + String(t.getUTCMonth() + 1).padStart(2, "0") + String(t.getUTCDate()).padStart(2, "0"), h: +o.hour };
  }
  function ctDays() { var now = new Date(), t = ctKey(now); return t.h < 6 ? [ctKey(now, -1).k, t.k] : [t.k]; }
  function board(url) {      // url already carries its query, or none; the events of every day asked for, today's copy first
    return Promise.all(ctDays().reverse().map(function (k) {
      return fetch(url + (url.indexOf("?") < 0 ? "?" : "&") + "dates=" + k, { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
    })).then(function (all) {
      var seen = {}, ev = [];
      all.forEach(function (d) { (d.events || []).forEach(function (e) { if (!seen[e.id]) { seen[e.id] = 1; ev.push(e); } }); });
      return { events: ev };
    });
  }
  function socCups() {
    if (Date.now() - SOC.at < 15 * 60e3) return Promise.resolve();
    SOC.at = Date.now();
    return Promise.all(Object.keys(SOC.mine).map(function (id) {
      return fetch(ESPN + "all/teams/" + id, { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (d) {
        var e = ((d.team || {}).nextEvent || [])[0]; if (!e || !e.league) return "";
        var dt = +new Date(e.date) - Date.now();
        return dt < 36 * 3600e3 && dt > -4 * 3600e3 ? e.league.slug || "" : "";
      }).catch(function () { return ""; });
    })).then(function (l) { SOC.cups = l.filter(function (x, i) { return x && SOC.base.indexOf(x) < 0 && l.indexOf(x) === i; }); });
  }
  function pullSoc(lg, cup) {
    return board(ESPN + lg + "/scoreboard").then(function (d) {
      var n = 0, mine = "";
      (d.events || []).forEach(function (e) {
        var c = (e.competitions || [])[0] || {}, st = ((c.status || e.status || {}).type || {}).state || "pre", when = new Date(e.date);
        var late = st === "pre" && Date.now() >= +when && Date.now() - when < 3 * 3600e3;
        if (!late && (st !== "in" || when - Date.now() > 60e3)) return;
        var his = (c.competitors || []).some(function (x) { return SOC.mine[String((x.team || {}).id)]; });
        if (his && !mine) mine = e.id;
        if (!cup || his) n++;            // a cup only counts his own match
      });
      return { n: n, mine: mine };

  }
  function soccer() {
    return socCups().then(function () {
      return Promise.all(SOC.base.map(function (lg) { return pullSoc(lg, false); }).concat(SOC.cups.map(function (lg) { return pullSoc(lg, true); })));
    }).then(function (r) {
      SOC.n = r.reduce(function (a, x) { return a + x.n; }, 0);

  }
  var live = {};          // league key -> the fav team's live game, when there is one
  var count = 0;
  var PK = {}, pkAt = 0;  // Pennant Chase keys off the MLB gamePk, not an ESPN id

  function slug(s) { return String(s || "").toLowerCase().replace(/[^a-z0-9]/g, ""); }
  function mlbKeys() {
    if (Date.now() - pkAt < 15 * 60e3) return Promise.resolve();
    pkAt = Date.now();

    return fetch("https://statsapi.mlb.com/api/v1/schedule?sportId=1&startDate=" + ds[0] + "&endDate=" + ds[ds.length - 1], { cache: "no-store" })

  }
  function mlbPk(g) {
    var set = PK[slug(g.away) + "|" + slug(g.home)];
    if (!set || !set.length) return 0;
    return set.slice().sort(function (x, y) { return Math.abs(x.t - g.date) - Math.abs(y.t - g.date); })[0].pk;
  }

  function pull(key) {
    var lg = LG[key];
    return board("https://site.api.espn.com/apis/site/v2/sports/" + lg.path + "/scoreboard" + lg.q)
      .then(function (d) {
        var on = [], mine = null;
        (d.events || []).forEach(function (e) {
          var c = (e.competitions || [])[0] || {};
          var st = ((c.status || e.status || {}).type || {}).state || "pre";
          var when = new Date(e.date);
          // ESPN flags a delayed start as "in" before first pitch; nothing is live until its start time passes
          // ...and once the clock passes the start, a game ESPN still calls "Scheduled" counts as live (up to 3 hours)
          var late = st === "pre" && Date.now() >= +when && Date.now() - when < 3 * 3600e3;
          if (!late && (st !== "in" || when - Date.now() > 60e3)) return;
          on.push(e.id);
          var side = function (ha) {
            var x = (c.competitors || []).filter(function (t) { return t.homeAway === ha; })[0] || {};
            return x.team || {};
          };
          var a = side("away"), h = side("home");
          if (!mine && (a.abbreviation === lg.fav || h.abbreviation === lg.fav)) {
            mine = { id: e.id, date: +when, away: a.displayName || "", home: h.displayName || "" };
          }
        });
        live[key] = mine;
        return on.length;
      })
      .catch(function () { live[key] = null; return 0; });
  }

  function href(key) {
    var g = live[key]; if (!g) return "";
    var lg = LG[key];
    if (lg.pk) { var pk = mlbPk(g); return pk ? lg.game + pk : ""; }
    return g.id ? lg.game + g.id : "";
  }
  function paint() {
    document.getElementById("live").classList.toggle("on", count > 0);
    document.getElementById("liveT").textContent = count ? "Live \u00b7 " + count : "Live";
    var on = {};
    TILES.forEach(function (t) {
      var el = document.getElementById(t.el); if (!el) return;
      var to = "";
      for (var i = 0; i < t.keys.length && !to; i++) to = href(t.keys[i]);
      el.href = to || t.home;
      var id = t.tile || t.el;
      if (to) on[id] = on[id] || t.el;
    });
    var sc = document.getElementById("tSoc");
    if (sc) { sc.href = SOC.live ? SITE + "the-pitch/#match-" + SOC.live : SITE + "the-pitch/#home"; sc.classList.toggle("on", !!SOC.live); }
    ["tFb", "tBb", "tHk", "tBk"].forEach(function (id) {
      var el = document.getElementById(id); if (!el) return;
      el.classList.toggle("on", !!on[id]);
      el.classList.toggle("onl", on[id] === "tFbN");   // Cowboys live: pill sits over the star
    });
  }
  function go() {
    var keys = Object.keys(LG);
    Promise.all(keys.map(pull).concat([mlbKeys(), soccer()])).then(function (n) {
      count = n.slice(0, keys.length).reduce(function (a, b) { return a + (b || 0); }, 0) + SOC.n;
      paint();
    });
  }
  // Command Center reads its league from localStorage cc-league (same origin), so each half picks the day
  function pick(e) {
    var a = e.target.closest && e.target.closest(".hf[data-lg]"); if (!a) return;
    try { localStorage.setItem("cc-league", JSON.stringify(a.dataset.lg)); } catch (x) {}
  }
  document.addEventListener("click", pick, true);
  document.addEventListener("auxclick", pick, true);
  paint(); go(); setInterval(go, 60000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) go(); });
})();
document.querySelectorAll('.tile img').forEach(function(i){i.onerror=function(){i.style.visibility='hidden'}});
/* v21: installable as a home screen app; the worker is pass-through, nothing is cached */
if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(function(){});}
</script>
<script>
/* v20: golf cup lights up while a tournament round is on. v33: only while players are on the course (golfNow) */
/* GOLFNOW-START v33 (Press Box) / v9 (The Green): golf is live only while players are on the course.
   ESPN keeps a tournament "In Progress" all week, overnight too, so the event status alone is not enough.
   Same code in both pages; _tests/golf-live/test-golfnow.js checks the two copies match. */
function golfNow(ev, now){
  now = now == null ? Date.now() : now;
  var STOP = /suspend|delay|postpon|cancel|halt|weather|rain|dark/i;
  function ty(x){ return (x && x.status && x.status.type) || {}; }
  function words(t){ return [t.name, t.description, t.detail, t.shortDetail].join(' '); }
  function when(iso){
    var d = new Date(iso), o = {timeZone:'America/Chicago'};
    var day = function(x){ return x.toLocaleDateString('en-US', {timeZone:'America/Chicago'}); };
    var t = d.toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit', timeZone:o.timeZone});
    return day(d) === day(new Date(now)) ? t : d.toLocaleDateString('en-US', {weekday:'short', timeZone:o.timeZone}) + ' ' + t;
  }
  var out = {live:false, text:'', round:0};
  if (!ev) return out;
  var es = ty(ev), cs = [];
  (ev.competitions || []).forEach(function(c){ if (Array.isArray(c)) c.forEach(function(y){ cs.push(y); }); else cs.push(c); });
  var c0 = cs[0] || {}, ct = ty(c0);
  var round = out.round = (c0.status && c0.status.period) || 0;
  if (es.state === 'post' || es.completed) {
    out.text = /cancel/i.test(words(es)) ? 'Canceled' : /postpon/i.test(words(es)) ? 'Postponed' : 'Final';
    return out;
  }
  var going = es.state === 'in' || cs.some(function(c){ return ty(c).state === 'in'; });
  if (!going) return out;                                   // before the week starts: nothing to say here
  var stopped = cs.filter(function(c){ return STOP.test(words(ty(c))); })[0] || (STOP.test(words(es)) ? ev : null);
  // per-player status (leaderboard feed, stroke play) is the best evidence; the scoreboard feed has none
  var players = cs.length === 1 ? (c0.competitors || []).filter(function(p){ return ty(p).state; }) : [];
  if (!stopped) {
    if (players.length) {
      out.live = players.some(function(p){
        var t = ty(p), tee = p.status.teeTime ? Date.parse(p.status.teeTime) : NaN;
        return t.state === 'in' && !STOP.test(words(t)) && !(tee > now + 60e3);
      });
    } else {
      out.live = cs.some(function(c){ var t = ty(c); return t.state === 'in' && !/complete|final/i.test(words(t)); });
    }
  }
  if (out.live) { out.text = round ? 'Round ' + round : 'On the course'; return out; }
  if (stopped) {
    var w = words(ty(stopped)) + ' ' + words(es), r = (stopped.status && stopped.status.period) || round;
    out.text = (r ? 'Round ' + r + ' ' : 'Play ') + (/suspend|halt|dark/i.test(w) ? 'suspended' : /postpon/i.test(w) ? 'postponed' : /cancel/i.test(w) ? 'canceled' : 'delayed');
    return out;
  }
  var next = players.filter(function(p){ return ty(p).state === 'pre' && p.status.teeTime && Date.parse(p.status.teeTime) > now; })
    .sort(function(a, b){ return Date.parse(a.status.teeTime) - Date.parse(b.status.teeTime); })[0];
  if (next) {
    var nr = next.status.period || round;
    out.next = next.status.teeTime;
    out.text = (nr ? 'R' + nr + ' tees off ' : 'Tees off ') + when(next.status.teeTime);
    return out;
  }
  var allDone = players.length && players.every(function(p){ return ty(p).state === 'post'; });
  if (round && (/complete/i.test(words(ct)) || allDone)) out.text = 'Round ' + round + ' complete';
  else out.text = 'Between rounds';
  return out;
}
/* GOLFNOW-END */
(function(){var el=document.getElementById('tGolf'),q=el.querySelector('.gq');
var SB='https://site.api.espn.com/apis/site/v2/sports/golf/pga/scoreboard',LB='https://site.web.api.espn.com/apis/site/v2/sports/golf/leaderboard?league=pga&event=';
function j(u){return fetch(u,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();});}
function show(g){var on=!!g.live,t=on||g.text==='Final'?'':(g.text||'');el.classList.toggle('on',on);q.textContent=t;el.setAttribute('aria-label','The Green, golf'+(on?', live':t?', '+t:''));}
/* the scoreboard has no per-player status, so while a week is under way ask the leaderboard who is on the course */
function go(){j(SB).then(function(s){var e=(s.events||[])[0];if(!e){show({});return;}var g=golfNow(e);if(!g.text||g.text==='Final'||g.text==='Canceled'||g.text==='Postponed'){show(g);return;}
return j(LB+e.id).then(function(l){var x=(l.events||[])[0];show(x&&x.status?golfNow(x):g);},function(){show(g);});}).catch(function(){});}
go();setInterval(go,60000);document.addEventListener('visibilitychange',function(){if(!document.hidden)go();});})();
</script>
