<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Live">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Live · Press Box</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1220'/%3E%3Ccircle cx='32' cy='32' r='14' fill='%23ef4444'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600&display=swap">
<style>
:root{--bg:#0b1220;--card:#131c2e;--line:#22304a;--ink:#e8eef8;--dim:#8a98b3;--live:#ef4444}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;min-height:100dvh;
  padding:calc(18px + env(safe-area-inset-top)) clamp(14px,2.5vw,32px) calc(28px + env(safe-area-inset-bottom))}
@media (max-width:520px){body{padding-top:calc(30px + env(safe-area-inset-top))}}
a{color:inherit;text-decoration:none}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.back{font-family:Oswald,sans-serif;font-weight:500;letter-spacing:.12em;text-transform:uppercase;font-size:13px;color:var(--dim);
  border:1px solid var(--line);border-radius:999px;padding:6px 14px;min-height:36px;display:inline-flex;align-items:center}
@media (pointer:coarse){.back{min-height:44px;padding:0 18px;font-size:14px}}
.back:hover{color:var(--ink);border-color:var(--dim)}
h1{font-family:Oswald,sans-serif;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:clamp(24px,3.4vw,38px);
  display:flex;align-items:center;gap:12px}
.dot{width:.42em;height:.42em;border-radius:50%;background:var(--dim);flex:none}
.on .dot{background:var(--live);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(239,68,68,.6)}70%{box-shadow:0 0 0 .5em rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
@media (prefers-reduced-motion:reduce){.on .dot{animation:none}}
.meta{margin-left:auto;color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums;text-align:right}
h2{font-family:Oswald,sans-serif;font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:clamp(15px,1.6vw,19px);
  display:flex;align-items:center;gap:10px;margin:22px 0 10px;padding-left:10px;border-left:4px solid var(--c,#3b82f6)}
h2 small{font-family:Inter,sans-serif;font-weight:600;font-size:12px;letter-spacing:.06em;color:var(--dim)}
h2 a:hover{text-decoration:underline;text-underline-offset:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.g{position:relative;display:block;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c,#3b82f6);border-radius:14px;
  padding:12px 14px 10px;transition:transform .15s,border-color .15s}
.g:hover{transform:translateY(-2px);border-color:var(--c)}
.g.fav{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 8px 26px color-mix(in srgb,var(--c) 28%,transparent)}
.row{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;padding:4px 0}
.row img,.row .ph{width:34px;height:34px;object-fit:contain;filter:drop-shadow(0 0 1px rgba(255,255,255,.5))}
.row .ph{display:grid;place-items:center;border-radius:8px;background:var(--line);font:600 10px Inter,sans-serif;filter:none}
.tm{font-family:Oswald,sans-serif;font-weight:500;font-size:18px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm i{font-style:normal;font-size:12px;color:var(--dim);margin-right:5px}
.tm b{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ink);margin-left:7px;vertical-align:middle}
.tm small{font-family:Inter,sans-serif;font-size:11px;color:var(--dim);margin-left:7px;letter-spacing:0}
.sc{font-family:Oswald,sans-serif;font-weight:700;font-size:28px;font-variant-numeric:tabular-nums;line-height:1}
.row.trail .sc,.row.trail .tm{color:var(--dim)}
.foot{display:flex;justify-content:space-between;gap:10px;margin-top:6px;padding-top:7px;border-top:1px solid var(--line);font-size:12px;color:var(--dim)}
.foot .st{color:var(--live);font-weight:600;letter-spacing:.03em}
.foot .rz{color:var(--live);font-weight:600}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:6px 16px}
.li{display:grid;grid-template-columns:74px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--card) 60%,transparent);
  border-left:3px solid var(--c,#3b82f6);font-size:14px}
.li:hover{background:var(--card)}
.li.fav{background:var(--card);box-shadow:inset 0 0 0 1px var(--c)}
.li .t{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
.li .t .dl{color:var(--live);font-weight:600;font-variant-numeric:normal}
.li .m{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .m i{font-style:normal;font-size:11px;color:var(--dim);margin-right:3px}
.li .m b{font-weight:600}
.li .r{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
/* v7: the rivalry badge, a small violet pill over a card's teams, and a second line under a list row's matchup */
.g .rv{display:inline-block;max-width:100%;margin:0 0 4px;padding:2px 9px;border-radius:999px;background:rgba(160,120,255,.17);color:#c4a8ff;
  font:500 11px/1.35 Oswald,sans-serif;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:top}
.li .m .rv{display:block;overflow:hidden;text-overflow:ellipsis;margin-top:2px;font:500 10.5px/1.3 Oswald,sans-serif;font-style:normal;letter-spacing:.12em;text-transform:uppercase;color:#c4a8ff}
.empty{border:1px dashed var(--line);border-radius:14px;padding:28px 16px;text-align:center;color:var(--dim)}
.empty strong{display:block;font-family:Oswald,sans-serif;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);font-size:20px;margin-bottom:6px}
.nfl,.cfb{--c:#3b82f6}.cfb{--c:#e8232a}.mlb{--c:#c0111f}.nhl{--c:#00843d}.nba{--c:#0064b1}.soc{--c:#e0a526}
@media (max-width:520px){.meta{width:100%;margin-left:0;text-align:left}.sc{font-size:24px}}
/* league-look: leagues are told apart by a small neutral league chip (NFL, NHL, NBA...) in its own column, not by colour.
   Colour is kept for state only (live red). Every league edge and section bar is one calm neutral; his own team's game
   gets a soft light ring and a bold matchup, the same in every league. */
.nfl,.cfb,.mlb,.nhl,.nba,.soc{--c:#33415e}
h2{border-left-color:#33415e}
.g.fav,.li.fav{--c:#a9b6cc}
.g.fav{box-shadow:0 0 0 1px var(--c),0 8px 26px rgba(0,0,0,.35)}
.li{grid-template-columns:62px 40px 1fr auto;border-left-color:transparent}
.li.fav .m{font-weight:600}
.lc{justify-self:start;min-width:36px;text-align:center;padding:1px 5px;border-radius:5px;border:1px solid #2c3a56;background:#0e1626;
  color:#c9d3e4;font:500 11px/1.2 Oswald,sans-serif;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.li.fav .lc{border-color:#55648a;color:var(--ink)}
@media (max-width:420px){.li{grid-template-columns:56px 38px 1fr auto;gap:8px;padding:8px 9px}}
/* v8: players. Each card and list row names its leading players (or the probable starters before a game); one tap opens the shared player sheet */
.who{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;font-size:12px;color:var(--dim)}
.who span[data-pbp]{color:var(--ink);font-weight:600;border-bottom:1px dotted var(--dim);padding:2px 0}
.who span[data-pbp]:hover{border-bottom-color:var(--ink)}
.who small{font-size:11px;margin-left:4px;color:var(--dim)}
.li .m .who{display:block;margin-top:2px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .m .who>span{margin-right:10px}   /* v8: a list row fits its names on one line and ends in an ellipsis, never a clipped tag */
@media (pointer:coarse){.who span[data-pbp]{padding:6px 0}}
</style>
<style>
/* v9: the day at a glance. One row per sport (its picture is the row label), the Central day's hours across, each game
   a block in its time slot as long as a game usually runs, live games in red, a red line at the time now.
   The hours scroll sideways under the pinned sport pictures and the grid opens scrolled to now. Tap a game for its card. */
.sum{display:flex;flex-wrap:wrap;gap:6px 16px;margin:-4px 0 12px;font-size:13px;color:var(--dim)}
.sum b{color:var(--ink);font-weight:600}.sum .lv b{color:var(--live)}
.dg{position:relative;overflow-x:auto;overflow-y:hidden;border:1px solid var(--line);border-radius:14px;background:#0d1526;
  -webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scrollbar-width:thin;scrollbar-color:#33415e transparent}
.dgi{position:relative}
.ax{display:flex;height:30px;border-bottom:1px solid var(--line);position:relative}
.ax .hr{position:absolute;top:0;height:30px;padding:8px 0 0 6px;font:500 12px/1 Oswald,sans-serif;letter-spacing:.06em;color:var(--dim);white-space:nowrap;border-left:1px solid var(--line)}
.sp{position:relative;display:flex;border-bottom:1px solid var(--line)}
.sp:last-child{border-bottom:0}
.lab{position:sticky;left:0;z-index:4;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:8px;gap:3px;
  background:#0d1526;border-right:1px solid var(--line);box-shadow:6px 0 10px -6px rgba(0,0,0,.6)}
.lab img{width:44px;height:44px;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
.lab .lc{font-size:9.5px;min-width:0;padding:0 4px;justify-self:auto}
.ax .lab{height:30px;padding:0;box-shadow:none}
.ln{position:relative;flex:none}
.ln .hl{position:absolute;top:0;bottom:0;border-left:1px solid rgba(34,48,74,.55)}
.b{position:absolute;display:flex;flex-direction:column;justify-content:center;gap:1px;height:40px;padding:3px 8px;overflow:hidden;overflow:clip;cursor:pointer;
  text-align:left;color:var(--ink);font:inherit;background:var(--card);border:1px solid #2a3a58;border-radius:9px;transition:border-color .15s,background .15s}
.b:hover,.b:focus-visible{border-color:#6b7ea3;background:#18233a;outline:none}
.b .m1,.b .m2{display:block;width:fit-content;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:sticky;left:calc(var(--lab,76px) + 6px)}   /* a game that began off to the left still shows its names */
.b .m1{font:500 15px/1.15 Oswald,sans-serif;letter-spacing:.03em}
.b .m1 i{font-style:normal;font-size:11px;color:var(--dim);margin-right:3px}
.b .m1 em{font-style:normal;font-weight:700;font-variant-numeric:tabular-nums;margin:0 2px 0 4px}
.b .m1 .lo{color:var(--dim)}
.b .m2{font-size:11px;line-height:1.2;color:var(--dim);font-variant-numeric:tabular-nums}
.b .m2 .k{color:#c9d3e4;font:500 10px/1 Oswald,sans-serif;letter-spacing:.08em;margin-right:5px}
.b .m2 .rv{color:#c4a8ff;font:500 10px/1 Oswald,sans-serif;letter-spacing:.1em;text-transform:uppercase;margin-right:5px}
.b.post{background:#101828;border-color:#1f2c45}.b.post .m1{color:#c3cde0}
.b.in{border-color:var(--live);background:#22161f;box-shadow:0 0 0 1px rgba(239,68,68,.35)}
.b.in .m2{color:#ff8a8a;font-weight:600}
.b.in .m2::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--live);margin-right:5px;vertical-align:1px;animation:pulse 1.6s infinite}
.b.fav{box-shadow:0 0 0 1px #a9b6cc}.b.fav .m1{font-weight:700}.b.in.fav{box-shadow:0 0 0 1px #a9b6cc,0 0 0 3px rgba(239,68,68,.35)}
.b.rvg{border-left:3px solid #a078ff}
.now{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--live);z-index:3;pointer-events:none;box-shadow:0 0 8px rgba(239,68,68,.6)}
.now span{position:absolute;top:5px;left:4px;padding:2px 6px;border-radius:5px;background:var(--live);color:#fff;font:600 11px/1.2 Inter,sans-serif;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.b.in .m2::before{animation:none}}
@media (max-width:520px){.lab img{width:36px;height:36px}.b .m1{font-size:14px}.dg{border-radius:12px;margin:0 -4px}}
/* the game sheet: the full card (scores, situation, players, rivalry), one tap away from the grid */
.gs{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(3,7,15,.82);padding:16px 12px calc(16px + env(safe-area-inset-bottom))}
.gs.on{display:flex}
@media (min-width:700px){.gs{align-items:center}}
.gs .bx{width:min(420px,100%);position:relative}
.gs .x{position:absolute;top:-44px;right:0;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 18px/1 Inter,sans-serif;cursor:pointer}
.gs .lead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px;color:var(--dim)}
.gs .lead a{color:var(--ink);font-weight:600;border-bottom:1px solid var(--dim)}
.gs .g{box-shadow:0 18px 50px rgba(0,0,0,.6)}
/* round 2: "+N more" under a sport's picture, and the full list it opens */
.lab .more{margin-top:4px;padding:2px 6px;border-radius:999px;border:1px solid #55648a;background:#18233a;color:var(--ink);cursor:pointer;
  font:600 10px/1.3 Inter,sans-serif;white-space:nowrap;max-width:calc(100% - 4px);overflow:hidden;text-overflow:ellipsis}
.lab .more:hover,.lab .more:focus-visible{border-color:var(--ink);outline:none}
@media (pointer:coarse){.lab .more{padding:5px 6px}}
/* v9: on the narrow phone label "+12 more" was clipped; slimmer sides, and it wraps to two lines rather than lose text */
@media (max-width:520px){.lab .more{padding-left:3px;padding-right:3px;max-width:calc(100% - 2px);letter-spacing:-.01em;white-space:normal;overflow:visible;text-overflow:clip;line-height:1.15;text-align:center}}
.gs .mlist{max-height:min(70vh,560px);overflow-y:auto;padding:6px;display:flex;flex-direction:column;gap:4px}
.mi{display:grid;grid-template-columns:78px 1fr;gap:10px;align-items:center;width:100%;padding:8px 10px;border-radius:9px;border:1px solid transparent;
  background:#0f1828;color:var(--ink);font:inherit;font-size:14px;text-align:left;cursor:pointer;min-height:40px}
.mi:hover,.mi:focus-visible{border-color:#6b7ea3;outline:none}
.mi .mt{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi.in{border-color:rgba(239,68,68,.5)}.mi.in .mt{color:#ff8a8a;font-weight:600}
.mi.fav .mm{font-weight:700}
.mi .mm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi .mm i{font-style:normal;font-size:11px;color:var(--dim);margin-right:3px}
.mi .mm em{font-style:normal;font-weight:700;font-variant-numeric:tabular-nums}
.mi .mm .lo{color:var(--dim)}
.mi .mm .rv{display:block;background:none;padding:0;margin:2px 0 0;border-radius:0;color:#c4a8ff;font:500 10px/1.3 Oswald,sans-serif;letter-spacing:.1em;text-transform:uppercase}
</style>
</head>
<body>
<header>
  <a class="back" href="https://sloanescott16.github.io/">&lsaquo; Press Box</a>
  <h1 id="ttl"><span class="dot"></span><span id="ttlText">Live</span></h1>
  <div class="meta" id="meta">Loading the boards</div>
</header>
<main id="app"><div class="sum" id="sum"></div><div class="dg" id="dg"><div class="dgi" id="dgi"></div></div><div id="msg"></div></main>
<div class="gs" id="gs" role="dialog" aria-modal="true" aria-label="Game"><div class="bx"><button class="x" type="button" aria-label="Close">&times;</button><div id="gsb"></div></div></div>
<script>
"use strict";
const SITE = "https://sloanescott16.github.io/";
const LEAGUES = [
  { key:"nfl", label:"NFL",              path:"football/nfl",              q:"",                       fav:"DAL", href:SITE+"lone-star-board/?lg=nfl#scores", game:SITE+"lone-star-board/?lg=nfl#game-" },
  { key:"cfb", label:"College football", path:"football/college-football", q:"?groups=80&limit=400",   fav:"TTU", href:SITE+"lone-star-board/?lg=cfb#scores", game:SITE+"lone-star-board/?lg=cfb#game-", slim:true },
  { key:"mlb", label:"MLB",              path:"baseball/mlb",              q:"",                       fav:"TEX", href:SITE+"lone-star-diamond/#live", game:SITE+"lone-star-diamond/#game-" },
  { key:"nhl", label:"NHL",              path:"hockey/nhl",                q:"",                       fav:"DAL", href:SITE+"the-crease/#live", game:SITE+"the-crease/#game-" },
  { key:"nba", label:"NBA",              path:"basketball/nba",            q:"",                       fav:"DAL", href:SITE+"the-paint/#live", game:SITE+"the-paint/#game-" },
  // v5: soccer, every card opens The Pitch. Club leagues list the whole slate; the international boards only list the USA outside the live cards.
  soc("epl",  "Premier League",          "eng.1"),
  soc("liga", "LALIGA",                  "esp.1"),
  soc("ucl",  "Champions League",        "uefa.champions"),
  soc("mls",  "MLS",                     "usa.1"),
  soc("wc",   "World Cup",               "fifa.world"),
  soc("fri",  "Friendlies",              "fifa.friendly", { slim:true }),
  soc("cnl",  "Concacaf Nations League", "concacaf.nations.league", { slim:true }),
  soc("unl",  "UEFA Nations League",     "uefa.nations", { slim:true })
];
/* league-look: the short league mark shown as a chip on every list row */
const CHIP = { nfl:"NFL", cfb:"CFB", mlb:"MLB", nhl:"NHL", nba:"NBA", epl:"EPL", liga:"LIGA", ucl:"UCL", mls:"MLS", wc:"WC", fri:"INTL", cnl:"CNL", unl:"UNL" };
const chipOf = lg => CHIP[lg.key] || String(lg.abbr || lg.label || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase().slice(0, 5) || "CUP";
function soc(key, label, slug, more) { return Object.assign({ key, label, path:"soccer/" + slug, q:"", soc:true, cls:"soc", href:SITE+"the-pitch/#scores", game:SITE+"the-pitch/#match-" }, more || {}); }
const MYSOC = { "185":1, "360":1, "86":1, "1068":1, "660":1 };   // FC Dallas, Man United, Real Madrid, Atletico, USA

    return `<span>${s.outs} out${s.outs === 1 ? "" : "s"} · ${on.length ? "on " + on.join(", ") : "bases empty"}${g.tv ? " · " + esc(g.tv) : ""}</span>`;   // the network rides after the bases
  }

}
const logo = t => t.logo ? `<img src="${esc(t.logo)}" alt="" loading="lazy" data-ab="${esc(t.ab)}"${t.alt ? ` data-alt="${esc(t.alt)}"` : ""} onerror="logoFail(this)">` : `<span class="ph">${esc(t.ab)}</span>`;
function logoFail(i) { if (i.dataset.alt) { const u = i.dataset.alt; delete i.dataset.alt; i.src = u; return; }   // a club with no dark crest falls back to the light one
  const s = document.createElement("span"); s.className = "ph"; s.textContent = i.dataset.ab || ""; i.replaceWith(s); }
function card(g) {
  const a = +g.away.score || 0, h = +g.home.score || 0, pos = String((g.sit || {}).possession || "");
  const row = (t, trail) => `<div class="row${trail ? " trail" : ""}">${logo(t)}<div class="tm">${t.rank ? `<i>${t.rank}</i>` : ""}${esc(g.lg.slim || g.lg.soc ? t.name : t.ab)}${pos && pos === t.id ? "<b></b>" : ""}${g.lg.slim || g.lg.soc ? "" : `<small>${esc(t.rec)}</small>`}</div><div class="sc">${esc(t.score)}</div></div>`;
  const top = g.lg.soc ? row(g.home, h < a) + row(g.away, a < h) : row(g.away, a < h) + row(g.home, h < a);   // soccer reads home side first
  return `<a class="g ${g.lg.cls || g.lg.key}${g.fav ? " fav" : ""}" href="${gameHref(g)}">${g.rival ? `<span class="rv" title="Rivalry game">${esc(g.rival)}</span>` : ""}${top}${whoHtml(g)}<div class="foot"><span class="st">${esc(g.detail)}</span>${sitText(g)}</div></a>`;

/* v9: the day grid. One row per sport, the Central day's hours across; the league chips ride under each row's picture. */
const SPORTS = [
  { key:"nfl", img:"https://a.espncdn.com/i/teamlogos/nfl/500/dal.png", chip:"NFL", name:"NFL" },
  { key:"cfb", img:"https://a.espncdn.com/i/teamlogos/ncaa/500/2641.png", chip:"CFB", name:"College football" },
  { key:"mlb", img:"img/mlb.webp", chip:"MLB", name:"Baseball" },
  { key:"nhl", img:"img/nhl.webp", chip:"NHL", name:"Hockey" },
  { key:"nba", img:"img/nba.webp", chip:"NBA", name:"Basketball" },
  { key:"soc", img:"img/soc.webp", chip:"Soccer", name:"Soccer" }
];
const RUN = { nfl:195, cfb:210, mlb:180, nhl:150, nba:150, soc:115 };   // how long a game usually runs, minutes
const sportOf = lg => lg.soc ? "soc" : lg.key;
const CTT = new Intl.DateTimeFormat("en-US", { timeZone:"America/Chicago", hour:"numeric", minute:"2-digit" });
const ctTime = d => CTT.format(d).replace(":00", "");

function dayMin(d, day) {   // minutes from Central midnight of day (YYYYMMDD) to d
  const o = ctParts(d), a = Date.UTC(+o.year, +o.month - 1, +o.day), b = Date.UTC(+day.slice(0, 4), +day.slice(4, 6) - 1, +day.slice(6));

const hourName = h => { const x = ((h % 24) + 24) % 24; return x === 0 ? "12 AM" : x === 12 ? "Noon" : x < 12 ? x + " AM" : (x - 12) + " PM"; };
const GM = {};
let opened = "", scrolled = false, userScrolled = false;
function block(g, x, w, y) {
  const a = +g.away.score || 0, h = +g.home.score || 0, post = g.state === "post", pre = g.state === "pre";
  const nm = (t, lose) => `<span${lose ? ' class="lo"' : ""}>${t.rank ? `<i>${t.rank}</i>` : ""}${esc(t.ab)}${pre ? "" : `<em>${esc(t.score)}</em>`}</span>`;
  const one = g.lg.soc ? [g.home, h < a && post, g.away, a < h && post] : [g.away, a < h && post, g.home, h < a && post];
  const m1 = nm(one[0], one[1]) + (pre ? (g.lg.soc ? " v " : " at ") : " ") + nm(one[2], one[3]);

  const m2 = (g.lg.soc ? `<span class="k">${esc(chipOf(g.lg))}</span>` : "") + (g.rival ? `<span class="rv">${esc(g.rival)}</span>` : "") + (pre ? esc(st) : st);

  return `<button type="button" class="b ${g.state}${g.fav ? " fav" : ""}${g.rival ? " rvg" : ""}" data-g="${esc(k)}" style="left:${x}px;width:${w}px;top:${y}px" title="${esc(g.away.full || g.away.name)} at ${esc(g.home.full || g.home.name)}"><span class="m1">${m1}</span><span class="m2">${m2}</span></button>`;
}
function openSheet(k) {
  const g = GM[k]; if (!g) return closeSheet();
  opened = k;
  document.getElementById("gsb").innerHTML = `<div class="lead"><span>${esc(g.lg.label)} · ${g.state === "pre" ? "starts " + esc(ctTime(g.date)) : g.state === "in" ? "live" : "final"}</span><a href="${gameHref(g)}">Game center &rsaquo;</a></div>${card(g)}`;
  document.getElementById("gs").classList.add("on");
}
function closeSheet() { opened = ""; document.getElementById("gs").classList.remove("on"); }
/* round 2: a sport row keeps a few lanes; the rest of its games sit behind "+N more", a list in the same sheet */
const MORE = {};
function openMore(key) {
  const m = MORE[key]; if (!m) return closeSheet();
  const old = document.querySelector("#gsb .mlist"), keepTop = opened === "more:" + key && old ? old.scrollTop : 0;
  opened = "more:" + key;
  const row = g => { const a = +g.away.score || 0, h = +g.home.score || 0, pre = g.state === "pre", post = g.state === "post";
    const nm = (t, lose) => `<span${lose ? ' class="lo"' : ""}>${t.rank ? `<i>${t.rank}</i>` : ""}${esc(g.lg.slim || g.lg.soc ? t.name : t.ab)}${pre ? "" : ` <em>${esc(t.score)}</em>`}</span>`;
    const one = g.lg.soc ? [g.home, h < a && post, g.away, a < h && post] : [g.away, a < h && post, g.home, h < a && post];
    return `<button type="button" class="mi ${g.state}${g.fav ? " fav" : ""}" data-g="${esc(g.lg.key + ":" + g.id)}"><span class="mt">${pre ? esc(ctTime(g.date)) : esc(g.detail || (post ? "Final" : "Live"))}</span>` +
      `<span class="mm">${nm(one[0], one[1])}${pre ? (g.lg.soc ? " v " : " at ") : " "}${nm(one[2], one[3])}${g.rival ? `<small class="rv">${esc(g.rival)}</small>` : ""}</span></button>`; };
  document.getElementById("gsb").innerHTML = `<div class="lead"><span>${esc(m.name)} · ${m.gs.length} games today</span></div><div class="g mlist">${m.gs.map(row).join("")}</div>`;
  document.querySelector("#gsb .mlist").scrollTop = keepTop;
  document.getElementById("gs").classList.add("on");
}
document.getElementById("dg").addEventListener("click", e => { const mo = e.target.closest(".more[data-more]"); if (mo) return openMore(mo.dataset.more);
  const b = e.target.closest(".b[data-g]"); if (b) openSheet(b.dataset.g); });
document.getElementById("gs").addEventListener("click", e => { const mi = e.target.closest(".mi[data-g]"); if (mi) return openSheet(mi.dataset.g);
  if (e.target.closest(".x") || e.target.id === "gs") closeSheet(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && opened && !document.querySelector("#pbpSheet.on")) closeSheet(); });
document.getElementById("dg").addEventListener("scroll", () => { if (scrolled && !render.busy) userScrolled = true; }, { passive:true });
function render() {
  const now = new Date(), all = [].concat(...LEAGUES.map(l => data[l.key] || []));
  const day = gridDay(), nowM = dayMin(now, day);
  // round 2: live games pass the same keep() filter as the rest (college: his teams, ranked, rivalry, Big 12 country)
  const today = all.filter(g => (!g.lg.cup || g.fav) && keep(g) && (g.state === "in" || ctKey(g.date) === day));
  const live = today.filter(g => g.state === "in");
  for (const k in GM) delete GM[k];
  for (const k in MORE) delete MORE[k];
  for (const g of today) GM[g.lg.key + ":" + g.id] = g;
  const dg = document.getElementById("dg"), dgi = document.getElementById("dgi"); dg.style.display = "";   // shown before it is measured
  const phone = dg.clientWidth < 560;
  const LAB = phone ? 58 : 76, LANE = 44, TOP = 6, MAXL = 3;   // at most three lanes a sport, so every sport fits on one screen
  // the hours: from the first start (or now) to the last likely finish (or now), whole hours
  let lo = nowM, hi = nowM + 30;
  const span = g => { const s = dayMin(g.date, day); let e = s + RUN[sportOf(g.lg)]; if (g.state === "in") e = Math.max(e, nowM + 15); return [s, e]; };
  for (const g of today) { const [s, e] = span(g); lo = Math.min(lo, s); hi = Math.max(hi, e); }
  const h0 = Math.max(-6, Math.floor(lo / 60)), h1 = Math.max(h0 + 3, Math.ceil(hi / 60));
  // the phone scrolls the hours sideways; the PC squeezes the whole day into its width, no sideways scroll
  const PX = phone ? Math.max(120, Math.floor((dg.clientWidth - LAB - 2) / (h1 - h0))) : Math.max(24, (dg.clientWidth - LAB - 2) / (h1 - h0));
  const X = m => LAB + (m - h0 * 60) * PX / 60, W = Math.floor(LAB + (h1 - h0) * PX);
  const every = PX < 46 ? 2 : 1;   // a squeezed day names every other hour
  let rows = "", hours = "";
  for (let h = h0; h < h1; h++) if ((h - h0) % every === 0) hours += `<span class="hr" style="left:${X(h * 60)}px;width:${PX * every}px">${hourName(h)}</span>`;
  // which games get a lane first: his teams, live ones, rivalries, ranked, then by start time
  const pri = g => (g.fav ? 1000 : 0) + (g.state === "in" ? 400 : 0) + (g.rival ? 200 : 0) + (g.away.rank || g.home.rank ? 100 - Math.min(g.away.rank || 99, g.home.rank || 99) : 0);
  for (const sp of SPORTS) {
    const gs = today.filter(g => sportOf(g.lg) === sp.key).sort((p, q) => (p.date - q.date) || (q.fav - p.fav));
    if (!gs.length) continue;   // a sport with nothing today gets no row
    const lanes = [], out = [];
    let hid = 0;
    for (const g of gs.slice().sort((p, q) => (pri(q) - pri(p)) || (p.date - q.date))) {   // each game takes the first lane free for its whole run
      const [s, e] = span(g);
      let i = lanes.findIndex(L => L.every(([a, b]) => e + 2 <= a || s >= b + 2));
      if (i < 0 && lanes.length < MAXL) { i = lanes.length; lanes.push([]); }
      if (i < 0) { hid++; continue; }   // no room: it waits behind "+N more"
      lanes[i].push([s, e]);
      out.push(block(g, X(s) + 2, Math.max(phone ? 64 : 40, (e - s) * PX / 60 - 4), TOP + i * LANE));
    }
    if (hid) MORE[sp.key] = { name:sp.name, gs };
    const ht = Math.max(hid ? 96 : 76, TOP * 2 + lanes.length * LANE - 4);
    let lines = ""; for (let h = h0 + 1; h < h1; h++) lines += `<i class="hl" style="left:${X(h * 60) - LAB}px"></i>`;
    rows += `<div class="sp" style="height:${ht}px"><div class="lab" style="width:${LAB}px" title="${esc(sp.name)}"><img src="${esc(sp.img)}" alt="${esc(sp.name)}"><span class="lc">${esc(sp.chip)}</span>` +
      (hid ? `<button type="button" class="more" data-more="${esc(sp.key)}" title="All ${gs.length} ${esc(sp.name)} games today">+${hid} more</button>` : "") + `</div>` +
      `<div class="ln" style="width:${W - LAB}px">${lines}</div>${out.join("")}</div>`;
  }
  const inDay = nowM >= h0 * 60 && nowM <= h1 * 60;

  dgi.style.width = W + "px"; dg.style.setProperty("--lab", LAB + "px");
  dgi.innerHTML = rows ? `<div class="ax"><span class="lab" style="width:${LAB}px"></span>${hours}</div>${rows}` +
    (inDay ? `<div class="now" style="left:${X(nowM)}px"><span>${esc(ctTime(now))}</span></div>` : "") : "";
  dg.style.display = rows ? "" : "none";
  // the phone opens at now; if nothing is on yet, at the first game still to come (or now, once the day is done)
  if (rows && !userScrolled) {
    const next = today.filter(g => g.state === "pre").map(g => dayMin(g.date, day)).sort((p, q) => p - q)[0];
    const at = live.length || next == null || next <= nowM ? X(nowM) - LAB - (dg.clientWidth - LAB) * .3 : X(next) - LAB - 30;

  document.getElementById("msg").innerHTML = rows ? "" : `<div class="empty"><strong>No games today</strong>${Object.keys(data).length ? "This page fills in on its own when the day's games are posted." : "Waiting on the feeds."}</div>`;
  if (opened) opened.startsWith("more:") ? openMore(opened.slice(5)) : GM[opened] ? openSheet(opened) : closeSheet();
  document.getElementById("ttl").className = live.length ? "on" : "";
  document.getElementById("ttlText").textContent = live.length ? `Live · ${live.length}` : "Live";
  document.title = (live.length ? `(${live.length}) ` : "") + "Live · Press Box";
  const bad = LEAGUES.filter(l => down[l.key]).map(l => l.label);
  document.getElementById("meta").textContent = (stamp ? "Updated " + new Date(stamp).toLocaleTimeString([], { hour:"numeric", minute:"2-digit", second:"2-digit" }) : "Loading the boards") + (bad.length ? " · no feed: " + bad.join(", ") : "");
}
/* v9: a game that starts 11 PM to midnight Central sits on the next day's ESPN board (it is past midnight in the East),
   so from noon on tomorrow's board is read too, once a minute, and only its games still on today's Central date are kept. */
const LATE = {};
async function pull(lg, full) {
  try {
    const ask = async k => {
      const r = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${lg.path}/scoreboard${lg.q}${lg.q ? "&" : "?"}dates=${k}`, { cache:"no-store" });
      if (!r.ok) throw new Error(r.status);
      return (await r.json()).events || [];
    };
    const now = new Date();
    if (full) LATE[lg.key] = ctHour(now) >= 12 ? (await ask(ctKey(now, 1)).catch(() => [])).filter(e => ctKey(new Date(e.date)) === ctKey(now)) : [];
    const got = await Promise.all(ctDays().map(ask));

    data[lg.key] = [].concat(...got.reverse()).filter(e => !seen[e.id] && (seen[e.id] = 1)).map(e => norm(lg, e)); down[lg.key] = false;
  } catch (e) { down[lg.key] = true; }
}
let rsz = 0; window.addEventListener("resize", () => { clearTimeout(rsz); rsz = setTimeout(render, 150); });
async function tick() {
  clearTimeout(timer);

  const soon = k => (data[k] || []).some(g => g.state === "pre" && g.date - Date.now() < 10 * 60e3 && g.date - Date.now() > -60 * 60e3);
  // while games are on, only the leagues with a live or imminent game are polled fast; the rest ride along once a minute
  const full = !stamp || Date.now() - tick.full >= SLOW;
  if (full) await socCups();
  const want = LEAGUES.filter(l => full || anyLive(l.key) || soon(l.key));
  if (full) tick.full = Date.now();

  stamp = Date.now(); render();
  const hot = LEAGUES.some(l => anyLive(l.key) || soon(l.key));

tick.full = 0;
document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
render(); tick();
</script>
